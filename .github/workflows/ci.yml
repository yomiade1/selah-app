# CI for pull requests (ADR-024). Lean by design: no schedules, no runs on branch pushes,
# drafts skipped, one run per PR at a time, macOS only on request. Policy: tools/check-workflows.py.
name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
  workflow_dispatch:
    inputs:
      macos:
        description: Also run the macOS job
        type: boolean
        default: false

permissions: {}

concurrency:
  # Adding any label other than ci:macos must not cancel a run that's going.
  group: ci-${{ github.event.pull_request.number || github.ref }}${{ (github.event.action == 'labeled' && github.event.label.name != 'ci:macos') && '-ignored' || '' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  SELAH_CI: "1"

jobs:
  guard:
    name: guard
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false && (github.event.action != 'labeled' || github.event.label.name == 'ci:macos'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      gate: ${{ steps.changes.outputs.gate }}
      code: ${{ steps.changes.outputs.code }}
      macos: ${{ steps.changes.outputs.macos }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Workflow policy (SEC-10)
        run: python3 tools/check-workflows.py
      - name: Secret scan (SEC-05)
        run: python3 tools/check-secrets.py
      - name: Decide which jobs to run
        id: changes
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MACOS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'ci:macos') }}
          MACOS_INPUT: ${{ inputs.macos }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then
            git diff --name-only "$BASE_SHA" HEAD > changed.txt
          else
            git ls-files > changed.txt
          fi
          # Documents and the design prototype don't need a build; help content needs only the Linux gate.
          grep -Ev '^(docs/|design/prototype/|\.github/ISSUE_TEMPLATE/|\.github/pull_request_template\.md$|[^/]+\.md$)' changed.txt > gate.txt || true
          grep -Ev '^(content/kb/|content/help/)' gate.txt > code.txt || true
          gate=false; code=false; macos=false
          if [ -s gate.txt ]; then gate=true; fi
          if [ -s code.txt ]; then code=true; fi
          if [ ! -f tools/verify.sh ]; then
            gate=false; code=false
            echo "::notice::tools/verify.sh doesn't exist yet (M1.10), so only the policy checks ran."
          fi
          if [ "$code" = "true" ] && { [ "$MACOS_LABEL" = "true" ] || [ "$MACOS_INPUT" = "true" ]; }; then macos=true; fi
          { echo "gate=$gate"; echo "code=$code"; echo "macos=$macos"; } >> "$GITHUB_OUTPUT"
          echo "gate=$gate code=$code macos=$macos"

  linux:
    name: linux
    needs: guard
    if: needs.guard.outputs.gate == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.nuget/packages
            target
          key: linux-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/packages.lock.json', 'pnpm-lock.yaml') }}
          restore-keys: linux-
      - name: Toolchain (same script as cloud sessions)
        run: bash tools/cloud-setup.sh
      - name: Gate
        run: bash tools/verify.sh --ci
      - name: Keep the failure report
        if: failure() && hashFiles('target/verify-report/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-report-linux
          path: target/verify-report/
          retention-days: 3

  windows:
    name: windows
    needs: guard
    if: needs.guard.outputs.code == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.nuget/packages
            target
          key: windows-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/packages.lock.json', 'pnpm-lock.yaml') }}
          restore-keys: windows-
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - name: Gate
        shell: pwsh
        run: ./tools/verify.ps1 -CI
      - name: Build the installer
        if: hashFiles('tools/package.ps1') != ''
        shell: pwsh
        run: ./tools/package.ps1 -Channel dev -Version "0.0.${{ github.run_number }}"
      - name: Test the installer
        if: hashFiles('tools/test-installer.ps1') != ''
        shell: pwsh
        run: ./tools/test-installer.ps1
      - name: Upload the installer
        if: hashFiles('artifacts/installer/*') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Selah-win-x64-Setup
          path: artifacts/installer/
          retention-days: 7
      - name: Keep the failure report
        if: failure() && hashFiles('target/verify-report/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-report-windows
          path: target/verify-report/
          retention-days: 3

  macos:
    name: macos
    needs: guard
    if: needs.guard.outputs.macos == 'true'
    runs-on: macos-15
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.nuget/packages
            target
          key: macos-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', '**/packages.lock.json', 'pnpm-lock.yaml') }}
          restore-keys: macos-
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.x"
      - name: Gate
        run: bash tools/verify.sh --ci
      - name: Keep the failure report
        if: failure() && hashFiles('target/verify-report/**') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verify-report-macos
          path: target/verify-report/
          retention-days: 3
