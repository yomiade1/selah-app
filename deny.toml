# cargo deny check (SEC-09): advisories, licences (no GPL), bans and sources. Runs in gate stage 14.
[graph]
all-features = true

[advisories]
yanked = "deny"

[licenses]
confidence-threshold = 0.93
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause", "ISC", "Unicode-3.0", "Zlib", "BSL-1.0", "CC0-1.0", "MPL-2.0", "OFL-1.1", "WTFPL"]
# The allow list is policy; not every licence has to be in use today.
unused-allowed-license = "allow"

[licenses.private]
# Selah's own crates are unpublished and licensed by the root LICENSE (H-02).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between Selah's own unpublished crates are not wildcards.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
