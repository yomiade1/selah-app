[package]
name = "selah-testkit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file = "../../LICENSE"
publish.workspace = true
description = "Test helpers: run the real process stack in isolation, golden frames, fixtures"

[features]
# Golden-frame tests (gate stage 7).
golden = []

[dependencies]
selah-render = { path = "../selah-render" }
selah-media = { path = "../selah-media", features = ["render"] }
anyhow.workspace = true
selah-core = { path = "../selah-core" }
selah-ipc = { path = "../selah-ipc" }
selah-proto = { path = "../selah-proto" }
selah-runtime = { path = "../selah-runtime" }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "process", "fs"] }

[dev-dependencies]
# The e2e chaos test allows the watchdog's crash-loop back-off (policy::restart_delay).
selah-watchdog = { path = "../selah-watchdog" }

[target.'cfg(windows)'.dependencies]
# Chaos tests freeze a process by suspending its threads (src/freeze.rs).
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
