[package]
name = "selah-core-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file = "../../LICENSE"
publish.workspace = true
description = "The selah-core process: hosts core, serves the UI, drives the engine"

[[bin]]
name = "selah-core"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
selah-core = { path = "../selah-core" }
selah-kb = { path = "../selah-kb" }
selah-ipc = { path = "../selah-ipc" }
selah-proto = { path = "../selah-proto" }
selah-runtime = { path = "../selah-runtime" }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tracing.workspace = true
