[package]
name = "selah-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file = "../../LICENSE"
publish.workspace = true
description = "Selah core library: settings, live state, permissions and request handling"

[dependencies]
anyhow.workspace = true
blake3.workspace = true
crc32fast.workspace = true
flate2.workspace = true
prost.workspace = true
quick-xml.workspace = true
rusqlite = { version = "0.41", features = ["bundled"] }
selah-kb = { path = "../selah-kb" }
selah-net = { path = "../selah-net" }
selah-proto = { path = "../selah-proto" }
selah-render = { path = "../selah-render" }
selah-runtime = { path = "../selah-runtime" }
selah-secrets = { path = "../selah-secrets" }
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tracing.workspace = true
tempfile.workspace = true
uuid = { version = "1", features = ["v4", "v7"] }

[dev-dependencies]
fastrand = "2"
tracing-subscriber = { workspace = true, features = ["fmt", "std"] }
