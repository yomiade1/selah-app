[package]
name = "selah-media"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file = "../../LICENSE"
publish.workspace = true
description = "Media decoding through FFmpeg with a protocol, demuxer and decoder allowlist (SEC-04)"

[dependencies]
# Bindings to the pinned LGPL FFmpeg 7.1 shared build (FFMPEG_DIR, set by the gate and
# tools/tool-env.ps1). Only avcodec, avformat and avutil: the macOS build is decode-only.
ffmpeg-next = { version = "=9.0.0", default-features = false, features = ["codec", "format"] }
selah-render = { path = "../selah-render" }
cpal.workspace = true
blake3.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[[bin]]
name = "selah-media-worker"
path = "src/bin/selah_media_worker.rs"

[features]
# Kept for backwards compatibility with downstream manifests; `render` is always enabled.
render = []

[dev-dependencies]
tempfile.workspace = true
