syntax = "proto3";

package selah.v1;

import "selah/v1/common.proto";
import "selah/v1/render.proto";

option csharp_namespace = "Selah.Contracts.V1";

// Service planning, service types, teams, runtime projection and print/PDF export (M4.1).
enum ServiceItemKind {
  SERVICE_ITEM_KIND_UNSPECIFIED = 0;
  SERVICE_ITEM_KIND_SONG = 1;
  SERVICE_ITEM_KIND_SCRIPTURE = 2;
  SERVICE_ITEM_KIND_MEDIA = 3;
  SERVICE_ITEM_KIND_PRESENTATION = 4;
  SERVICE_ITEM_KIND_NOTE = 5;
  SERVICE_ITEM_KIND_COUNTDOWN = 6;
  SERVICE_ITEM_KIND_HEADER = 7;
  SERVICE_ITEM_KIND_AUDIO = 8;
}

message ServiceItem {
  Id id = 1;
  ServiceItemKind kind = 2;
  Id content_id = 3;
  Id arrangement_id = 4;
  string title = 5;
  string notes = 6;
  string scripture_reference = 7;
  string bible_translation = 8;
  string subtitle = 9;
  string owner = 10;
  uint32 duration_seconds = 11;
  Id template_id = 12;
  string look_name = 13;
  Id look_id = 14;
  Id background_media_id = 15;
  string status_tag = 16;
  string song_key = 17;
  uint32 countdown_seconds = 18;
  string countdown_target_time = 19;
  string countdown_message = 20;
  string translation_language = 21;
}

message Service {
  Id id = 1;
  string name = 2;
  Timestamp starts_at = 3;
  Id service_type_id = 4;
  repeated ServiceItem items = 5;
  repeated Id team_ids = 6;
  string series = 7;
  string location = 8;
  string notes = 9;
  Id source_service_id = 10;
  uint32 planned_duration_seconds = 11;
  Id default_template_id = 12;
  string default_look_name = 13;
}

message ServiceType {
  Id id = 1;
  string name = 2;
  string default_start_time = 3;
  uint32 default_duration_seconds = 4;
  string default_location = 5;
  Id default_template_id = 6;
  string default_look_name = 7;
  repeated ServiceItem template_items = 8;
}

message TeamMember {
  Id id = 1;
  string name = 2;
  string initials = 3;
  string role = 4;
  bool confirmed = 5;
  string mode_lock = 6;
}

message Team {
  Id id = 1;
  string name = 2;
  repeated TeamMember members = 3;
}

message SaveService {
  Service service = 1;
}

message DeleteService {
  Id id = 1;
}

message GetService {
  Id id = 1;
}

message ListServices {
  uint32 limit = 1;
  uint32 offset = 2;
}

message ServiceList {
  repeated Service services = 1;
}

message SaveServiceType {
  ServiceType service_type = 1;
}

message DeleteServiceType {
  Id id = 1;
}

message GetServiceType {
  Id id = 1;
}

message ListServiceTypes {
  uint32 limit = 1;
  uint32 offset = 2;
}

message ServiceTypeList {
  repeated ServiceType service_types = 1;
}

message SaveTeam {
  Team team = 1;
}

message DeleteTeam {
  Id id = 1;
}

message GetTeam {
  Id id = 1;
}

message ListTeams {
  uint32 limit = 1;
  uint32 offset = 2;
}

message TeamList {
  repeated Team teams = 1;
}

message CreateServiceFromPrevious {
  Id source_service_id = 1;
  Id service_type_id = 2;
  string name = 3;
  Timestamp starts_at = 4;
  string series = 5;
  bool keep_songs = 6;
}

message ProjectedServiceItem {
  Id item_id = 1;
  uint32 index = 2;
  uint32 offset_seconds = 3;
  uint32 duration_seconds = 4;
  Timestamp starts_at = 5;
  Timestamp ends_at = 6;
  string formatted_time = 7;
  string formatted_duration = 8;
  bool is_header = 9;
}

message ProjectServiceRuntime {
  Id service_id = 1;
  Service service = 2;
}

message ServiceRuntimeProjection {
  repeated ProjectedServiceItem items = 1;
  uint32 total_duration_seconds = 2;
  Timestamp projected_ends_at = 3;
  string formatted_start_time = 4;
  string formatted_end_time = 5;
  string formatted_total_duration = 6;
}

enum ServicePrintKind {
  SERVICE_PRINT_KIND_UNSPECIFIED = 0;
  SERVICE_PRINT_KIND_SERVICE_ORDER = 1;
  SERVICE_PRINT_KIND_CHORD_CHARTS = 2;
  SERVICE_PRINT_KIND_BOTH = 3;
}

message ExportServicePrint {
  Id service_id = 1;
  ServicePrintKind kind = 2;
  string output_path = 3;
}

message ServicePrintExport {
  string path = 1;
  string html = 2;
  bytes pdf_bytes = 3;
  uint32 page_count = 4;
}

// Live state machine, triggering, layers, hotkeys, audio layer and undo (M4.2).
message LiveSlide {
  uint32 index = 1;
  string label = 2;
  string section_kind = 3;
  string section_color = 4;
  string hotkey = 5;
  string text = 6;
  string chords_json = 7;
  string notes = 8;
  string title_text = 9;
  string reference_text = 10;
  string footer_text = 11;
  string translation_text = 12;
  string elements_json = 13;
  string style_json = 14;
  bool is_blank = 15;
}

message LiveItemSlides {
  Id item_id = 1;
  uint32 item_index = 2;
  ServiceItemKind kind = 3;
  string title = 4;
  string subtitle = 5;
  string song_key = 6;
  repeated LiveSlide slides = 7;
}

message LiveLayerStatus {
  LayerKind kind = 1;
  bool active = 2;
  string title = 3;
  string subtitle = 4;
  LayerSpec spec = 5;
}

message AudioLayerStatus {
  bool playing = 1;
  Id media_id = 2;
  string title = 3;
  string content_hash = 4;
  string media_extension = 5;
  float volume = 6;
  bool loop_audio = 7;
}

message LiveStatus {
  Id service_id = 1;
  string service_name = 2;
  bool has_active_item = 3;
  uint32 current_item_index = 4;
  uint32 current_slide_index = 5;
  bool has_next = 6;
  uint32 next_item_index = 7;
  uint32 next_slide_index = 8;
  string current_item_title = 9;
  string next_item_title = 10;
  string current_slide_label = 11;
  string next_slide_label = 12;
  string current_slide_text = 13;
  string next_slide_text = 14;
  string current_chords_json = 15;
  string current_notes = 16;
  string song_key = 17;
  repeated LiveSlide current_item_slides = 18;
  repeated LiveLayerStatus layers = 19;
  AudioLayerStatus audio = 20;
  bool show_logo = 21;
  bool cleared = 22;
  bool can_live_undo = 23;
  bool can_live_redo = 24;
  uint64 scene_revision = 25;
}

message LoadLiveService {
  Id service_id = 1;
  bool trigger_first_item = 2;
}

message TriggerItem {
  uint32 item_index = 1;
}

message TriggerSlide {
  uint32 item_index = 1;
  uint32 slide_index = 2;
}

message NextSlide {}

message PreviousSlide {}

message NextItem {}

message PreviousItem {}

message TriggerSectionHotkey {
  string hotkey = 1;
}

message ClearLayer {
  LayerKind kind = 1;
}

message SetLayerState {
  LayerSpec layer = 1;
}

message ShowLogoCommand {
  bool show_logo = 1;
}

message PlayAudioLayer {
  Id media_id = 1;
  float volume = 2;
  bool loop_audio = 3;
}

message StopAudioLayer {}

message LiveUndo {}

message LiveRedo {}

message GetLiveState {}

message LiveStateChanged {
  uint64 scene_revision = 1;
  Id service_id = 2;
  uint32 current_item_index = 3;
  uint32 current_slide_index = 4;
  bool cleared = 5;
  bool show_logo = 6;
  repeated LiveStatus status = 7;
}

message LiveSnapshotEntry {
  Scene scene = 1;
  LiveStatus status = 2;
}

message LiveMachineSnapshot {
  Service service = 1;
  repeated LiveItemSlides item_slides = 2;
  LiveStatus status = 3;
  repeated LiveSnapshotEntry undo_stack = 4;
  repeated LiveSnapshotEntry redo_stack = 5;
}
