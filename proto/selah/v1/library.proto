syntax = "proto3";

package selah.v1;

import "selah/v1/common.proto";

option csharp_namespace = "Selah.Contracts.V1";

enum SectionKind {
  SECTION_KIND_UNSPECIFIED = 0;
  SECTION_KIND_VERSE = 1;
  SECTION_KIND_CHORUS = 2;
  SECTION_KIND_BRIDGE = 3;
  SECTION_KIND_TAG = 4;
  SECTION_KIND_INTRO = 5;
  SECTION_KIND_OUTRO = 6;
  SECTION_KIND_OTHER = 7;
}

message Chord {
  // Unicode character offset in the lyric line, not a UTF-8 byte offset.
  uint32 position = 1;
  string text = 2;
}

message LyricLine {
  string text = 1;
  repeated Chord chords = 2;
}

message TranslationLines {
  repeated string lines = 1;
}

message Section {
  Id id = 1;
  string label = 2;
  SectionKind kind = 3;
  Color color = 4;
  string hotkey = 5;
  repeated LyricLine lines = 6;
  map<string, TranslationLines> translations = 7;
}

message Arrangement {
  Id id = 1;
  string name = 2;
  repeated Id section_ids = 3;
}

message Song {
  Id id = 1;
  string title = 2;
  repeated string authors = 3;
  string ccli_number = 4;
  string copyright = 5;
  string key = 6;
  double tempo = 7;
  repeated string tags = 8;
  bool public_domain = 9;
  repeated Section sections = 10;
  repeated Arrangement arrangements = 11;
}

message TemplateVariant {
  Id id = 1;
  Resolution resolution = 2;
  uint32 max_lines = 3;
  // Reserved for the metric text styles delivered in M3.
  string style_json = 4;
}

message Template {
  Id id = 1;
  string name = 2;
  repeated TemplateVariant variants = 3;
}

enum MediaKind {
  MEDIA_KIND_UNSPECIFIED = 0;
  MEDIA_KIND_IMAGE = 1;
  MEDIA_KIND_VIDEO = 2;
  MEDIA_KIND_AUDIO = 3;
}

message MediaItem {
  Id id = 1;
  string name = 2;
  MediaKind kind = 3;
  // Lower-case BLAKE3 hex; never an outside file path.
  string content_hash = 4;
  string extension = 5;
  uint64 size_bytes = 6;
  Resolution resolution = 7;
  uint64 duration_milliseconds = 8;
  repeated string tags = 9;
}

message Slide {
  Id id = 1;
  string text = 2;
  Id media_id = 3;
  // M3 extends this with structured elements. Generated song slides are not stored.
  string elements_json = 4;
}

message Presentation {
  Id id = 1;
  string name = 2;
  repeated Slide slides = 3;
  Id template_id = 4;
}

message Tag {
  Id id = 1;
  string name = 2;
}

enum DocumentType {
  DOCUMENT_TYPE_UNSPECIFIED = 0;
  DOCUMENT_TYPE_SONG = 1;
  DOCUMENT_TYPE_TEMPLATE = 2;
  DOCUMENT_TYPE_MEDIA = 3;
  DOCUMENT_TYPE_PRESENTATION = 4;
  DOCUMENT_TYPE_SERVICE = 5;
  DOCUMENT_TYPE_SERVICE_TYPE = 6;
  DOCUMENT_TYPE_TEAM = 7;
  DOCUMENT_TYPE_TAG = 8;
}

enum LibraryChangeKind {
  LIBRARY_CHANGE_KIND_UNSPECIFIED = 0;
  LIBRARY_CHANGE_KIND_SAVED = 1;
  LIBRARY_CHANGE_KIND_DELETED = 2;
}

// Serialised into ops.command and ops.inverse as a document snapshot or delete marker.
message OpState {
  bool present = 1;
  bytes data = 2;
}

message SaveSong {
  Song song = 1;
}

message DeleteSong {
  Id id = 1;
}

message GetSong {
  Id id = 1;
}

message ListSongs {
  uint32 limit = 1;
  uint32 offset = 2;
}

message SongList {
  repeated Song songs = 1;
}

message SaveTemplate {
  Template template = 1;
}

message DeleteTemplate {
  Id id = 1;
}

message GetTemplate {
  Id id = 1;
}

message ListTemplates {
  uint32 limit = 1;
  uint32 offset = 2;
}

message TemplateList {
  repeated Template templates = 1;
}

message SaveMediaItem {
  MediaItem media_item = 1;
}

message DeleteMediaItem {
  Id id = 1;
}

message GetMediaItem {
  Id id = 1;
}

message ListMediaItems {
  uint32 limit = 1;
  uint32 offset = 2;
}

message MediaItemList {
  repeated MediaItem media_items = 1;
}

message SavePresentation {
  Presentation presentation = 1;
}

message DeletePresentation {
  Id id = 1;
}

message GetPresentation {
  Id id = 1;
}

message ListPresentations {
  uint32 limit = 1;
  uint32 offset = 2;
}

message PresentationList {
  repeated Presentation presentations = 1;
}

message SaveTag {
  Tag tag = 1;
}

message DeleteTag {
  Id id = 1;
}

message GetTag {
  Id id = 1;
}

message ListTags {
  uint32 limit = 1;
  uint32 offset = 2;
}

message TagList {
  repeated Tag tags = 1;
}

message Undo {
  // Optional: when set, undoes the latest active undo group for this document only.
  Id doc_id = 1;
}

message Redo {
  // Optional: when set, redoes the most recently undone group for this document only.
  Id doc_id = 1;
}

message GetUndoState {
  // Optional: when set, returns the undo/redo stack state for this document.
  Id doc_id = 1;
}

message UndoState {
  bool can_undo = 1;
  bool can_redo = 2;
  uint32 undo_depth = 3;
  uint32 redo_depth = 4;
}

message EditorBuffer {
  Id doc_id = 1;
  DocumentType doc_type = 2;
  string content = 3;
  Timestamp updated_at = 4;
}

message SaveEditorBuffer {
  Id doc_id = 1;
  DocumentType doc_type = 2;
  string content = 3;
}

message DiscardEditorBuffer {
  Id doc_id = 1;
}

message GetEditorBuffer {
  Id doc_id = 1;
}

message EditorBufferReply {
  bool found = 1;
  EditorBuffer buffer = 2;
}

message ListEditorBuffers {
  uint32 limit = 1;
  uint32 offset = 2;
}

message EditorBufferList {
  repeated EditorBuffer buffers = 1;
}

message ListOps {
  uint64 after_seq = 1;
  uint32 limit = 2;
  Id doc_id = 3;
}

message OpRecord {
  uint64 seq = 1;
  Id op_id = 2;
  Timestamp timestamp = 3;
  string user_id = 4;
  string device_id = 5;
  string origin = 6;
  DocumentType doc_type = 7;
  Id doc_id = 8;
  bytes command = 9;
  bytes inverse = 10;
  Id undo_group = 11;
  int32 sync_status = 12;
}

message OpList {
  repeated OpRecord ops = 1;
}

message LibraryChanged {
  DocumentType doc_type = 1;
  Id doc_id = 2;
  LibraryChangeKind change = 3;
  uint64 op_seq = 4;
  Id undo_group = 5;
  bool from_undo_redo = 6;
}

message UndoStateChanged {
  UndoState global = 1;
  Id doc_id = 2;
  UndoState document = 3;
}
