syntax = "proto3";

package selah.v1;

option csharp_namespace = "Selah.Contracts.V1";

enum Appearance {
  APPEARANCE_UNSPECIFIED = 0;
  APPEARANCE_LIGHT = 1;
  APPEARANCE_BOOTH = 2;
  APPEARANCE_AUTOMATIC = 3;
}

// Scale values: 90, 100, 115, 130, 150, 175, 200. Core validates them.
message AppearanceSettings {
  Appearance appearance = 1;
  uint32 text_scale_percent = 2;
  bool use_computer_text_size = 3;
}

// Network access remains off until explicitly requested.
message Settings {
  AppearanceSettings appearance = 1;
  string update_feed_url = 2;
  bool allow_update_check = 3;
}

message GetSettings {}

message SetAppearance {
  AppearanceSettings appearance = 1;
}

// UI → core: Settings ▸ Updates. The feed must be an https:// address of a
// releases.<channel>.json file; nothing is fetched until the person asks (SEC-12, SEC-13).
message SetUpdateSettings {
  string update_feed_url = 1;
  bool allow_update_check = 2;
}

// UI → core: look for a newer version now. Only when the person asks (M1.11).
message CheckForUpdate {}

message UpdateCheck {
  bool available = 1;
  // The newer version, when one is available.
  string version = 2;
  string notes_markdown = 3;
  string current_version = 4;
}

// UI → core: download, verify and install this version. Refused while anything is on the
// screens (SAFE-06, SEC-12); the UI asks the person to clear them first.
message InstallUpdate {
  string version = 1;
}

enum PolicyLevel {
  POLICY_LEVEL_UNSPECIFIED = 0;
  POLICY_LEVEL_USER = 1;
  POLICY_LEVEL_MACHINE = 2;
  POLICY_LEVEL_ORGANISATION = 3;
}

message PolicySetting {
  string key = 1;
  string value_json = 2;
  PolicyLevel level = 3;
  bool locked = 4;
}

message SetPolicySetting {
  string key = 1;
  string value_json = 2;
  PolicyLevel level = 3;
  bool locked = 4;
}

message RemovePolicySetting {
  string key = 1;
  PolicyLevel level = 2;
}

message GetPolicySetting {
  string key = 1;
}

message GetPolicySettingReply {
  bool found = 1;
  PolicySetting setting = 2;
}
