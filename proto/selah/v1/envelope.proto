syntax = "proto3";

package selah.v1;

import "selah/v1/common.proto";
import "selah/v1/errors.proto";
import "selah/v1/help.proto";
import "selah/v1/library.proto";
import "selah/v1/render.proto";
import "selah/v1/settings.proto";

option csharp_namespace = "Selah.Contracts.V1";

enum ActorOrigin {
  ACTOR_ORIGIN_UNSPECIFIED = 0;
  ACTOR_ORIGIN_UI = 1;
  ACTOR_ORIGIN_API = 2;
  ACTOR_ORIGIN_MIDI = 3;
  ACTOR_ORIGIN_MACRO = 4;
  ACTOR_ORIGIN_TIMELINE = 5;
  ACTOR_ORIGIN_SYNC = 6;
  ACTOR_ORIGIN_TOUR = 7;
  ACTOR_ORIGIN_CORE = 8;
  ACTOR_ORIGIN_ENGINE = 9;
  ACTOR_ORIGIN_WATCHDOG = 10;
}

// This is attribution, not proof of identity. The receiver must authenticate
// the transport peer and bind the actor to that identity before authorising.
message Actor {
  string user_id = 1;
  string device_id = 2;
  ActorOrigin origin = 3;
}

message Envelope {
  uint64 id = 1;
  uint64 correlation_id = 2;
  Actor actor = 3;
  oneof body {
    Command command = 10;
    Query query = 11;
    Event event = 12;
    Reply reply = 13;
    Error error = 14;
  }
}

message Command {
  oneof action {
    RenderCommand render = 1;
    SetAppearance set_appearance = 2;
    RecordFeedback record_feedback = 3;
    ShowTestPattern show_test_pattern = 4;
    ClearOutputs clear_outputs = 5;
    CheckForUpdate check_for_update = 6;
    InstallUpdate install_update = 7;
    SetUpdateSettings set_update_settings = 8;
    RestartNormally restart_normally = 9;
    CreateSupportBundle create_support_bundle = 10;
    RunDiagnostics run_diagnostics = 11;
    SaveSong save_song = 12;
    DeleteSong delete_song = 13;
    SaveTemplate save_template = 14;
    DeleteTemplate delete_template = 15;
    SaveMediaItem save_media_item = 16;
    DeleteMediaItem delete_media_item = 17;
    SavePresentation save_presentation = 18;
    DeletePresentation delete_presentation = 19;
    SaveTag save_tag = 20;
    DeleteTag delete_tag = 21;
    Undo undo = 22;
    Redo redo = 23;
    SaveEditorBuffer save_editor_buffer = 24;
    DiscardEditorBuffer discard_editor_buffer = 25;
    SetPolicySetting set_policy_setting = 26;
    RemovePolicySetting remove_policy_setting = 27;
    ImportBible import_bible = 28;
    DeleteBible delete_bible = 29;
    ImportMedia import_media = 30;
    ExportSelahBundle export_selah_bundle = 31;
    ImportSelahBundle import_selah_bundle = 32;
    CreateLibraryBackup create_library_backup = 33;
    RestoreLibraryBackup restore_library_backup = 34;
    SetOutputConfigs set_output_configs = 35;
    PresentScene present_scene = 36;
    StagePreviewScene stage_preview_scene = 37;
    PreloadItems preload_items = 38;
  }
  // Optional client-supplied UUIDv7 grouping multiple mutations into one undo/redo step.
  Id undo_group = 100;
}

message PresentScene {
  Scene scene = 1;
}

message StagePreviewScene {
  Scene scene = 1;
}

// UI → watchdog: leave safe mode (SAFE-07, "Restart normally"). The watchdog restarts core and
// the UI without safe mode; the engine keeps the screens as they are. Core refuses it.
message RestartNormally {}

// UI → core: put a test pattern on every output (M1.8 "Show test pattern").
message ShowTestPattern {
  TestPattern pattern = 1;
}

// UI → core: clear every output through the normal path. The emergency lane is separate.
message ClearOutputs {}

message Query {
  oneof request {
    GetStatus get_status = 1;
    GetSettings get_settings = 2;
    SearchHelp search_help = 3;
    GetArticle get_article = 4;
    HelpForContext help_for_context = 5;
    Subscribe subscribe = 6;
    GetWatchdogStatus get_watchdog_status = 7;
    GetDiagnostics get_diagnostics = 8;
    GetSong get_song = 9;
    ListSongs list_songs = 10;
    GetTemplate get_template = 11;
    ListTemplates list_templates = 12;
    GetMediaItem get_media_item = 13;
    ListMediaItems list_media_items = 14;
    GetPresentation get_presentation = 15;
    ListPresentations list_presentations = 16;
    GetTag get_tag = 17;
    ListTags list_tags = 18;
    GetUndoState get_undo_state = 19;
    GetEditorBuffer get_editor_buffer = 20;
    ListEditorBuffers list_editor_buffers = 21;
    ListOps list_ops = 22;
    GetPolicySetting get_policy_setting = 23;
    SearchSongs search_songs = 24;
    SearchMedia search_media = 25;
    SearchScripture search_scripture = 26;
    SearchLibrary search_library = 27;
    ParsePastedSong parse_pasted_song = 28;
    TransposeSong transpose_song = 29;
    SplitSongSlides split_song_slides = 30;
    ListBibles list_bibles = 31;
    ParseScriptureReference parse_scripture_reference = 32;
    GetScripturePassages get_scripture_passages = 33;
    SplitScriptureSlides split_scripture_slides = 34;
    GetMediaThumbnail get_media_thumbnail = 35;
    GetOutputConfigs get_output_configs = 36;
    AnalyzeFlashRisk analyze_flash_risk = 37;
    RenderSceneThumbnail render_scene_thumbnail = 38;
  }
}

message GetStatus {}

message Status {
  bool connected = 1;
  bool safe_mode = 2;
  uint64 scene_revision = 3;
  // Core's view of the engine; the engine answers GetStatus with its own view.
  bool engine_connected = 4;
  uint64 engine_scene_revision = 5;
  // Checksum of the last frame shown on output 0 (BLAKE3 of its pixels).
  bytes frame_checksum = 6;
  string version = 7;
  // True while something other than nothing or the logo is on the screens (SAFE-06).
  bool live = 8;
  // Engine only: what draws the frames, e.g. "wgpu Dx12 NVIDIA GeForce MX350" or "cpu".
  string renderer = 9;
  // Engine only: the size of the output frames.
  Resolution output_resolution = 10;
  repeated OutputFrameStatus output_statuses = 11;
  uint64 preview_scene_revision = 12;
  bool flash_warning = 13;
}

message GetWatchdogStatus {}

message ProcessInfo {
  string role = 1;
  uint32 pid = 2;
  uint32 restarts = 3;
  bool running = 4;
}

message WatchdogStatus {
  repeated ProcessInfo processes = 1;
  bool safe_mode = 2;
  string safe_mode_reason = 3;
}

message Subscribe {
  repeated string event_names = 1;
}

message Heartbeat {
  uint64 monotonic_nanoseconds = 1;
}

message Event {
  oneof notification {
    FrameShown frame_shown = 1;
    Status status = 2;
    Heartbeat heartbeat = 3;
    EmergencyApplied emergency_applied = 4;
    LibraryChanged library_changed = 5;
    UndoStateChanged undo_state_changed = 6;
  }
}

message Reply {
  oneof result {
    Status status = 1;
    Settings settings = 2;
    HelpResults help_results = 3;
    Article article = 4;
    bool acknowledged = 5;
    WatchdogStatus watchdog_status = 6;
    UpdateCheck update_check = 7;
    SupportBundle support_bundle = 8;
    Diagnostics diagnostics = 9;
    DiagnosticsReport diagnostics_report = 10;
    Song song = 11;
    SongList song_list = 12;
    Template template = 13;
    TemplateList template_list = 14;
    MediaItem media_item = 15;
    MediaItemList media_item_list = 16;
    Presentation presentation = 17;
    PresentationList presentation_list = 18;
    Tag tag = 19;
    TagList tag_list = 20;
    UndoState undo_state = 21;
    EditorBufferReply editor_buffer = 22;
    EditorBufferList editor_buffer_list = 23;
    OpList op_list = 24;
    GetPolicySettingReply policy_setting = 25;
    SongSearchResults song_search_results = 26;
    MediaSearchResults media_search_results = 27;
    ScriptureSearchResults scripture_search_results = 28;
    LibrarySearchResults library_search_results = 29;
    ParsePastedSongReply parsed_song = 30;
    GeneratedSongSlides generated_song_slides = 31;
    BibleTranslation bible_translation = 32;
    BibleList bible_list = 33;
    ParseScriptureReferenceReply parsed_scripture_reference = 34;
    ScripturePassages scripture_passages = 35;
    GeneratedScriptureSlides generated_scripture_slides = 36;
    MediaThumbnail media_thumbnail = 37;
    ExportedSelahBundle exported_selah_bundle = 38;
    ImportedSelahBundle imported_selah_bundle = 39;
    LibraryBackupInfo library_backup_info = 40;
    RestoreLibraryBackupResult restore_library_backup_result = 41;
    OutputConfigList output_config_list = 42;
    FlashRiskReport flash_risk_report = 43;
    SceneThumbnail scene_thumbnail = 44;
  }
}

// UI → core: Help ▸ Report a problem (M1.13). Core saves a redacted support bundle (SEC-06).
message CreateSupportBundle {}

message SupportBundle {
  // Where the .zip was saved.
  string path = 1;
  // The problem-report form with the version filled in.
  string report_url = 2;
}

// UI → core: Help ▸ Diagnostics.
message GetDiagnostics {}

message Diagnostics {
  string version = 1;
  string os = 2;
  string arch = 3;
  bool safe_mode = 4;
  bool engine_connected = 5;
  string renderer = 6;
  Resolution output_resolution = 7;
}

// UI → core: Help ▸ Diagnostics ▸ Run benchmark. Refused while anything is live.
message RunDiagnostics {
  // The short run (1080p H.264 clip, fewer round trips), for tests.
  bool quick = 1;
}

message DiagnosticsReport {
  // Where the report (.json) was saved.
  string path = 1;
  double ipc_p99_ms = 2;
  bool ipc_pass = 3;
  string video_clip = 4;
  string video_decode = 5;
  uint64 video_frames = 6;
  uint64 video_dropped = 7;
  double video_composite_p99_ms = 8;
  bool video_pass = 9;
  double m3_p99_ms = 10;
  bool m3_pass = 11;
}
