syntax = "proto3";

package selah.v1;

import "selah/v1/common.proto";
import "selah/v1/errors.proto";
import "selah/v1/help.proto";
import "selah/v1/render.proto";
import "selah/v1/settings.proto";

option csharp_namespace = "Selah.Contracts.V1";

enum ActorOrigin {
  ACTOR_ORIGIN_UNSPECIFIED = 0;
  ACTOR_ORIGIN_UI = 1;
  ACTOR_ORIGIN_API = 2;
  ACTOR_ORIGIN_MIDI = 3;
  ACTOR_ORIGIN_MACRO = 4;
  ACTOR_ORIGIN_TIMELINE = 5;
  ACTOR_ORIGIN_SYNC = 6;
  ACTOR_ORIGIN_TOUR = 7;
  ACTOR_ORIGIN_CORE = 8;
  ACTOR_ORIGIN_ENGINE = 9;
  ACTOR_ORIGIN_WATCHDOG = 10;
}

// This is attribution, not proof of identity. The receiver must authenticate
// the transport peer and bind the actor to that identity before authorising.
message Actor {
  string user_id = 1;
  string device_id = 2;
  ActorOrigin origin = 3;
}

message Envelope {
  uint64 id = 1;
  uint64 correlation_id = 2;
  Actor actor = 3;
  oneof body {
    Command command = 10;
    Query query = 11;
    Event event = 12;
    Reply reply = 13;
    Error error = 14;
  }
}

message Command {
  oneof action {
    RenderCommand render = 1;
    SetAppearance set_appearance = 2;
    RecordFeedback record_feedback = 3;
    ShowTestPattern show_test_pattern = 4;
    ClearOutputs clear_outputs = 5;
    CheckForUpdate check_for_update = 6;
    InstallUpdate install_update = 7;
    SetUpdateSettings set_update_settings = 8;
    RestartNormally restart_normally = 9;
    CreateSupportBundle create_support_bundle = 10;
    RunDiagnostics run_diagnostics = 11;
  }
}

// UI → watchdog: leave safe mode (SAFE-07, "Restart normally"). The watchdog restarts core and
// the UI without safe mode; the engine keeps the screens as they are. Core refuses it.
message RestartNormally {}

// UI → core: put a test pattern on every output (M1.8 "Show test pattern").
message ShowTestPattern {
  TestPattern pattern = 1;
}

// UI → core: clear every output through the normal path. The emergency lane is separate.
message ClearOutputs {}

message Query {
  oneof request {
    GetStatus get_status = 1;
    GetSettings get_settings = 2;
    SearchHelp search_help = 3;
    GetArticle get_article = 4;
    HelpForContext help_for_context = 5;
    Subscribe subscribe = 6;
    GetWatchdogStatus get_watchdog_status = 7;
    GetDiagnostics get_diagnostics = 8;
  }
}

message GetStatus {}

message Status {
  bool connected = 1;
  bool safe_mode = 2;
  uint64 scene_revision = 3;
  // Core's view of the engine; the engine answers GetStatus with its own view.
  bool engine_connected = 4;
  uint64 engine_scene_revision = 5;
  // Checksum of the last frame shown on output 0 (BLAKE3 of its pixels).
  bytes frame_checksum = 6;
  string version = 7;
  // True while something other than nothing or the logo is on the screens (SAFE-06).
  bool live = 8;
  // Engine only: what draws the frames, e.g. "wgpu Dx12 NVIDIA GeForce MX350" or "cpu".
  string renderer = 9;
  // Engine only: the size of the output frames.
  Resolution output_resolution = 10;
}

message GetWatchdogStatus {}

message ProcessInfo {
  string role = 1;
  uint32 pid = 2;
  uint32 restarts = 3;
  bool running = 4;
}

message WatchdogStatus {
  repeated ProcessInfo processes = 1;
  bool safe_mode = 2;
  string safe_mode_reason = 3;
}

message Subscribe {
  repeated string event_names = 1;
}

message Heartbeat {
  uint64 monotonic_nanoseconds = 1;
}

message Event {
  oneof notification {
    FrameShown frame_shown = 1;
    Status status = 2;
    Heartbeat heartbeat = 3;
    EmergencyApplied emergency_applied = 4;
  }
}

message Reply {
  oneof result {
    Status status = 1;
    Settings settings = 2;
    HelpResults help_results = 3;
    Article article = 4;
    bool acknowledged = 5;
    WatchdogStatus watchdog_status = 6;
    UpdateCheck update_check = 7;
    SupportBundle support_bundle = 8;
    Diagnostics diagnostics = 9;
    DiagnosticsReport diagnostics_report = 10;
  }
}

// UI → core: Help ▸ Report a problem (M1.13). Core saves a redacted support bundle (SEC-06).
message CreateSupportBundle {}

message SupportBundle {
  // Where the .zip was saved.
  string path = 1;
  // The problem-report form with the version filled in.
  string report_url = 2;
}

// UI → core: Help ▸ Diagnostics.
message GetDiagnostics {}

message Diagnostics {
  string version = 1;
  string os = 2;
  string arch = 3;
  bool safe_mode = 4;
  bool engine_connected = 5;
  string renderer = 6;
  Resolution output_resolution = 7;
}

// UI → core: Help ▸ Diagnostics ▸ Run benchmark. Refused while anything is live.
message RunDiagnostics {
  // The short run (1080p H.264 clip, fewer round trips), for tests.
  bool quick = 1;
}

message DiagnosticsReport {
  // Where the report (.json) was saved.
  string path = 1;
  double ipc_p99_ms = 2;
  bool ipc_pass = 3;
  string video_clip = 4;
  string video_decode = 5;
  uint64 video_frames = 6;
  uint64 video_dropped = 7;
  double video_composite_p99_ms = 8;
  bool video_pass = 9;
}
